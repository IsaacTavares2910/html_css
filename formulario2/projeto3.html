<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    

<form action="/cadastro" method="post">
<h1>Cotação de seguro de Veículo</h1>
        <fieldset><legend>Condutor</legend>
            <label for="nome">nome proprietario:</label>
            <input type="text" id="nome" name="destinatario" placeholder="digite seu nome">

            <br> </br>
            
            <label for="cep">CNH</label>
            <input type="number" id="cep" name="Endereço" placeholder="Digite a CNH">

            <br> </br>
            
             <label for="data">Data de emissão</label>
             <input type="date" id="data" name="data">

             <br> </br>

              <input type="radio" name="estado" value="casado">casado
              

              <input type="radio" name="estado" value="solteiro">solteiro
              

              <input type="radio" name="estado" value="viuvo">viuvo
              

              <input type="radio" name="estado" value="divorciado">divorciado
              
        </fieldset>
        <fieldset><legend>Veículo</legend>

            <label for="placa">Placa do carro:</label>
            <input type="text" id="placa" name="placa" placeholder="MDK-1234">

            <br> </br>


            <label for="marca do veiculo">Marca do veiculo</label>
            <select name="veiculo"><option value="">Fiat</option><option value="">Honda</option><option value="">BYD</option>
            </select>
         </fieldset>

       <fieldset>
        <legend>Uso</legend>
        
            <p>Usa carro pra trabalho(Uber/Taxi)</p>

             <input type="radio" name="TRABALHO" value="sim">sim

             <input type="radio" name="TRABALHO" value="não">não

             <br> </br>

             <label>
                <input type="checkbox" name="rastreador" value="possui sim">
             Possui rastreador instalado
             </label>

        </fieldset>

       <br></br>



 <button>Solicitar Cotação</button>

            


</form>


</body>
</html>
