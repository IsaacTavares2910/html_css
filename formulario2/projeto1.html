<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>MATRÍCULA - ESCOLA ONLINE</h1> 
    <form action="/cadastro" method="post">
     <fieldset><legend>dados pessoais</legend>   
   
    <label for="nome">Nome:</label>
    <input type="text" id="nome" name="nome" placeholder="Digite seu nome">

    <br><br>

    <label for="email">E-mail:</label>
    <input type="email" id="email" name="email" placeholder="Digite seu e-mail">

    <br><br>

    <label for="senha">Senha:</label>
    <input type="password" id="senha" name="senha" placeholder="Digite sua senha">

    <br><br>

    <label for="telefone">Telefone:</label>
    <input type="tel" id="telefone" name="telefone" placeholder="Digite seu telefone">

    <br><br>

    <label for="data">Data de nascimento:</label>
    <input type="date" id="data" name="data">

    <br><br>

    </fieldset>


   <fieldset><legend>Preferencia de estudo</legend>


    <p>Área de interesse:</p>

    <label>
        <input type="checkbox" name="interesse" value="frontend">
        Front End
    </label>

    <br>

    <label>
        <input type="checkbox" name="interesse" value="backend">
        Back End
    </label>

    <br>

    <label>
        <input type="checkbox" name="interesse" value="design">
        Design
    </label>

    <br>

    <label>
        <input type="checkbox" name="interesse" value="dados">
        Dados
    </label>

    <br><br>

<label for="indicacao">Como ficou sabendo de nos?</label><select name="indicacao"><option value="">Parentes</option><option value="amigo"> amigo</option><option value="">Conhecidos</option></select>

<br><br>

</fieldset>

<br><br>

    <button type="submit">Enviar</button>
    <button type="reset">Limpar</button>
    
    


</form>
</body>
</html>
