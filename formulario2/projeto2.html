<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
 <form action="/cadastro" method="post">
    <h1>Finalizar Compra </h1>
        <fieldset><legend>endereco de entrega</legend>
            <label for="nome">nome do destinatario:</label>
            <input type="text" id="nome" name="destinatario" placeholder="digite seu nome">

            <br> </br>
            
            <label for="cep">CEP</label>
            <input type="number" id="cep" name="Endereço" placeholder="000000-00">

            <br> </br>
            
             <label for="Rua">Rua</label>
             <input type="text" id="Rua" name="Rua" placeholder="digite seu endereço">
             
             <br> </br>

             <label for="numero">Número</label>
             <input type="number" id="numero" name="numero" placeholder="Digite seu numero">
             
             <br></br>

             <label for="complemento">complemento</label>
             <input type="text" id="complemento" name="complemento" placeholder="me fale um complemento">
 
        </fieldset>

        <fieldset><legend>Opções de entrega</legend>
            <label for="entrega">Periodo de entrega</label><select name="entrega"> <option value="">Manhã(08-12h)</option><option value="">Tarde(13-17h)</option><option value="">Noite(18-21)</option></select>


            <br> </br>

            <p>Instruções de entrega:</p>

            <input type="radio" name="entrega" value="portaria">deixar na portaria

            <br> </br>

            <input type="radio" name="entrega" value="na mao">deixar na mão

            <br> </br>

            <input type="radio" name="entrega" value="ligar">ligar ao chegar

            <label for="desconto">Cupom de desconto</label>

            <input type="text" id="desconto" name="cupom">

            <br> </br>

            <label>
                <input type="checkbox" name="ofertas" value="Receber ofertas por whatsApp">
                Receber ofertas por whatsApp
                </label>
                

        </fieldset>

        <button>Finalizar Compra</button>




</form>
</body>
</html>
